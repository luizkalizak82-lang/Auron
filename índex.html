
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050806">
  <title>AURON — Assistente de IA</title>

  <style>
    :root {
      color-scheme: dark;
      --green: #39ff88;
      --green-soft: #19d96b;
      --bg: #050806;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: #f3fff7;
      background: radial-gradient(
        ellipse at center,
        #0a1b11 0%,
        #050806 52%,
        #020403 100%
      );
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 20px 24px;
    }

    header {
      width: 100%;
      max-width: 760px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-weight: 800;
      letter-spacing: .28em;
      font-size: 1.08rem;
    }

    .status {
      font-size: .78rem;
      color: #9ab8a5;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--green);
    }

    main {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .orb-wrap {
      width: min(66vw, 290px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      position: relative;
      margin: 10px 0 28px;
    }

    .ring {
      position: absolute;
      border: 1px solid rgba(57, 255, 136, .17);
      border-radius: 50%;
      inset: 0;
      animation: rotate 18s linear infinite;
    }

    .ring::before {
      content: "";
      position: absolute;
      width: 7px;
      height: 7px;
      background: var(--green);
      border-radius: 50%;
      top: 13%;
      left: 18%;
      box-shadow: 0 0 15px var(--green);
    }

    .ring.two {
      inset: 13%;
      border-style: dashed;
      border-color: rgba(57, 255, 136, .13);
      animation-direction: reverse;
      animation-duration: 27s;
    }

    .orb {
      width: 57%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(
        circle at 32% 27%,
        #baffd1 0%,
        #48ff8f 13%,
        #12b958 43%,
        #075b2c 72%,
        #032b16 100%
      );
      box-shadow:
        0 0 24px rgba(57, 255, 136, .42),
        0 0 70px rgba(20, 220, 100, .2),
        inset -12px -18px 32px rgba(0, 0, 0, .42),
        inset 8px 8px 22px rgba(215, 255, 229, .3);
      transition: transform .12s ease, box-shadow .12s ease;
      animation: breathe 3.2s ease-in-out infinite;
    }

    .orb.listening {
      animation: listen .65s ease-in-out infinite alternate;
      box-shadow:
        0 0 35px rgba(57, 255, 136, .7),
        0 0 105px rgba(20, 220, 100, .35);
    }

    h1 {
      font-size: clamp(1.5rem, 5vw, 2.2rem);
      margin: 0 0 10px;
      letter-spacing: .02em;
    }

    .subtitle {
      margin: 0;
      max-width: 460px;
      line-height: 1.6;
      color: #a3b9aa;
      font-size: .95rem;
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 26px;
    }

    button {
      border: 1px solid rgba(57, 255, 136, .55);
      border-radius: 999px;
      padding: 13px 20px;
      background: rgba(18, 185, 88, .12);
      color: #eafff1;
      font-size: .94rem;
      font-weight: 650;
      cursor: pointer;
    }

    button.primary {
      background: var(--green);
      color: #03170b;
      border-color: var(--green);
    }

    button:active {
      transform: scale(.98);
    }

    .hint {
      min-height: 24px;
      margin-top: 16px;
      color: #7e9a87;
      font-size: .8rem;
    }

    footer {
      color: #557260;
      font-size: .72rem;
      letter-spacing: .06em;
      text-align: center;
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(.96);
      }
      50% {
        transform: scale(1.04);
      }
    }

    @keyframes listen {
      from {
        transform: scale(.94);
      }
      to {
        transform: scale(1.13);
      }
    }

    @keyframes rotate {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <header>
      <div class="brand">AURON</div>

      <div class="status">
        <span class="status-dot"></span>
        <span id="statusLabel">PRONTO</span>
      </div>
    </header>

    <main>
      <div class="orb-wrap" aria-label="Esfera verde do Auron">
        <div class="ring"></div>
        <div class="ring two"></div>
        <div class="orb" id="orb"></div>
      </div>

      <h1>Estou aqui.</h1>

      <p class="subtitle">
        Seu assistente pessoal de inteligência artificial.<br>
        Toque no microfone e comece a falar.
      </p>

      <div class="controls">
        <button class="primary" id="listenBtn">
          🎙️ Falar com Auron
        </button>

        <button id="stopBtn">Parar</button>
      </div>

      <div class="hint" id="hint" aria-live="polite">
        A esfera pulsa suavemente enquanto aguarda.
      </div>
    </main>

    <footer>
      PROTÓTIPO AURON · INTERFACE EM DESENVOLVIMENTO
    </footer>

  </div>

  <script>
    const orb = document.getElementById("orb");
    const hint = document.getElementById("hint");
    const statusLabel = document.getElementById("statusLabel");
    const listenBtn = document.getElementById("listenBtn");
    const stopBtn = document.getElementById("stopBtn");

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    let recognition;

    function setListening(on) {
      orb.classList.toggle("listening", on);
      statusLabel.textContent = on ? "OUVINDO" : "PRONTO";
    }

    listenBtn.addEventListener("click", () => {
      if (!SpeechRecognition) {
        hint.textContent =
          "Este navegador não oferece reconhecimento de voz aqui. " +
          "Você ainda pode testar a animação da esfera.";

        orb.classList.add("listening");
        statusLabel.textContent = "MODO DEMO";

        setTimeout(() => {
          orb.classList.remove("listening");
          statusLabel.textContent = "PRONTO";
        }, 2200);

        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = "pt-BR";
      recognition.interimResults = true;
      recognition.continuous = false;

      recognition.onstart = () => {
        setListening(true);
        hint.textContent = "Pode falar — estou ouvindo.";
      };

      recognition.onresult = (event) => {
        const result =
          event.results[event.results.length - 1][0].transcript;

        hint.textContent =
          "Entendi você dizer: “" + result + "”";

        const confidence = Math.max(
          0,
          Math.min(
            1,
            event.results[event.results.length - 1][0].confidence || 0.5
          )
        );

        orb.style.transform =
          `scale(${1 + confidence * 0.14})`;
      };

      recognition.onerror = () => {
        hint.textContent =
          "Não consegui captar a voz. Confira a permissão " +
          "do microfone e tente de novo.";
      };

      recognition.onend = () => {
        setListening(false);
        orb.style.transform = "";
      };

      try {
        recognition.start();
      } catch (e) {
        hint.textContent = "Toque novamente para tentar falar.";
        setListening(false);
      }
    });

    stopBtn.addEventListener("click", () => {
      if (recognition) {
        recognition.stop();
      }

      setListening(false);
      orb.style.transform = "";

      hint.textContent = "Aguardando seu próximo comando.";
    });
  </script>
</body>
</html>
